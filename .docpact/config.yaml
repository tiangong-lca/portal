version: 1
layout: repo
lastReviewedAt: "2026-08-26"
lastReviewedCommit: "c192d23eb6a6c3f8e97e1deeced0fcf03deac885"
lastReviewedNote: "Initial governance for the anonymous public Portal repository."

catalog:
  repos:
    - id: portal
      path: .
      canonicalRepo: tiangong-lca/portal
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/design-plan.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: portal-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - docs/**
          - .docpact/config.yaml
      ownerRepo: portal
    - id: portal-product-runtime
      paths:
        include:
          - package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - components.json
          - tsconfig.json
          - next.config.ts
          - postcss.config.mjs
          - prettier.config.mjs
          - vitest.config.ts
          - vitest.setup.ts
          - playwright.config.ts
          - edgeone.json
          - .node-version
          - .npmrc
          - .env.example
          - src/**
          - public/**
          - tests/**
          - scripts/**
          - .github/workflows/**
      ownerRepo: portal

coverage:
  include:
    - AGENTS.md
    - README.md
    - docs/**
    - .docpact/config.yaml
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - components.json
    - tsconfig.json
    - next.config.ts
    - postcss.config.mjs
    - prettier.config.mjs
    - vitest.config.ts
    - vitest.setup.ts
    - playwright.config.ts
    - edgeone.json
    - .node-version
    - .npmrc
    - .env.example
    - src/**
    - public/**
    - tests/**
    - scripts/**
    - .github/workflows/**
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - .next/**
    - coverage/**
    - playwright-report/**
    - test-results/**

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    product-plan:
      paths:
        - docs/design-plan.md
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - docs/**
        - .docpact/config.yaml
    app-runtime:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - components.json
        - tsconfig.json
        - next.config.ts
        - postcss.config.mjs
        - src/**
        - public/**
    proof:
      paths:
        - vitest.config.ts
        - vitest.setup.ts
        - playwright.config.ts
        - tests/**
        - scripts/**
        - .github/workflows/**
    deployment:
      paths:
        - edgeone.json
        - .node-version
        - .npmrc
        - .env.example
        - package.json
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - docs/design-plan.md
    - .docpact/config.yaml

repo:
  id: portal
  owner: portal

rules:
  - id: portal-governance-contract
    scope: repo
    repo: portal
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: README.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/design-plan.md
        mode: review_or_update
    reason: Repository boundaries, landing guidance, documentation routing, and the implementation plan must stay aligned.

  - id: portal-design-plan-contract
    scope: repo
    repo: portal
    triggers:
      - path: docs/design-plan.md
        kind: technical-plan
    requiredDocs:
      - path: docs/design-plan.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Product, data, security, UI, release, and cross-repository target state is owned by one plan.

  - id: portal-product-runtime-contract
    scope: repo
    repo: portal
    triggers:
      - path: package.json
        kind: package-runtime
      - path: pnpm-lock.yaml
        kind: dependency-lock
      - path: pnpm-workspace.yaml
        kind: package-runtime
      - path: components.json
        kind: ui-system
      - path: tsconfig.json
        kind: compiler-config
      - path: next.config.ts
        kind: framework-config
      - path: postcss.config.mjs
        kind: style-config
      - path: prettier.config.mjs
        kind: format-config
      - path: .node-version
        kind: runtime-version
      - path: .npmrc
        kind: package-policy
      - path: src/**
        kind: product-code
      - path: public/**
        kind: public-asset
    requiredDocs:
      - path: docs/design-plan.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Portal runtime changes must stay inside the anonymous read-only product and architecture contract.

  - id: portal-proof-and-deployment-contract
    scope: repo
    repo: portal
    triggers:
      - path: vitest.config.ts
        kind: test-config
      - path: vitest.setup.ts
        kind: test-config
      - path: playwright.config.ts
        kind: test-config
      - path: tests/**
        kind: test
      - path: scripts/**
        kind: validation-tool
      - path: .github/workflows/**
        kind: ci
      - path: edgeone.json
        kind: deployment-config
      - path: .env.example
        kind: env-contract
    requiredDocs:
      - path: docs/design-plan.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Proof, environment, and deployment changes must preserve release gates and secret boundaries.
