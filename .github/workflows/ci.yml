name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit gates
        run: pnpm check

      - name: Audit high-impact dependency vulnerabilities
        run: pnpm check:vulnerabilities

      - name: Build component workspace
        run: pnpm build:storybook

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production browser gates
        run: pnpm test:e2e

      - name: Run component interaction and accessibility gates
        run: |
          pnpm exec node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { storybookBrowserLaunchOptions } from './vitest.config.ts';
          const browser = await chromium.launch(storybookBrowserLaunchOptions);
          try {
            const page = await browser.newPage();
            const webgl = await page.evaluate(() => {
              const gl = document.createElement('canvas').getContext('webgl2');
              if (!gl) return { available: false };
              const debug = gl.getExtension('WEBGL_debug_renderer_info');
              return {
                available: true,
                version: gl.getParameter(gl.VERSION),
                renderer: gl.getParameter(debug ? debug.UNMASKED_RENDERER_WEBGL : gl.RENDERER),
              };
            });
            console.log(JSON.stringify({ browser: browser.version(), launch: storybookBrowserLaunchOptions, webgl }));
          } finally {
            await browser.close();
          }
          JS
          pnpm test:storybook
