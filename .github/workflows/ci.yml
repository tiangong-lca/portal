name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit gates
        run: pnpm check
      - name: Audit vulnerabilities
        run: pnpm check:vulnerabilities

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Production integration gates
        run: pnpm test:e2e

  components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build component workspace
        run: pnpm build:storybook
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run component interaction and accessibility gates
        run: |
          pnpm exec node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { storybookBrowserLaunchOptions } from './vitest.config.ts';
          const browser = await chromium.launch(storybookBrowserLaunchOptions);
          try {
            const page = await browser.newPage();
            const webgl = await page.evaluate(() => {
              const gl = document.createElement('canvas').getContext('webgl2');
              if (!gl) return { available: false };
              const debug = gl.getExtension('WEBGL_debug_renderer_info');
              return {
                available: true,
                version: gl.getParameter(gl.VERSION),
                renderer: gl.getParameter(debug ? debug.UNMASKED_RENDERER_WEBGL : gl.RENDERER),
              };
            });
            console.log(JSON.stringify({ browser: browser.version(), launch: storybookBrowserLaunchOptions, webgl }));
          } finally {
            await browser.close();
          }
          JS
          pnpm test:storybook

  validate:
    if: ${{ always() }}
    needs: [static, browser, components]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$COMPONENTS_RESULT" = success
